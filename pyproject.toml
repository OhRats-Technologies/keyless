[project]
name = "keyless"
version = "0.1.2"
description = "Dual-camera stereo gaze tracking, pop-click detection, and voice/AI control for Linux Wayland"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "evdev>=2.0.0",
    "httpx>=0.28.1",
    "jeepney>=0.9.0",
    "keyring>=25.7.0",
    "mediapipe>=1.2.3",
    "numpy>=2.5.5",
    "ollama>=0.6.3",
    "onnx-asr>=0.12.0",
    "opencv-python>=5.1.0.95",
    "playwright>=1.65.2",
    "pydantic>=2.14.3",
    "pyside6>=6.12.0",
    "rapidfuzz>=3.14.6",
    "rapidocr-onnxruntime>=1.4.4",
    "scikit-learn>=1.9.1",
    "sounddevice>=0.5.6",
    "typer>=0.29.1",
    "websockets>=17.4",
]

[project.scripts]
keyless = "keyless.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keyless"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
