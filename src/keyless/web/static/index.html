<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keyless</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="site-shell">
    <aside class="site-sidebar" aria-label="Primary navigation">
      <div class="site-brand">
        <div class="brand-lockup">
          <img src="/assets/icon.svg" alt="Keyless">
          <strong>Keyless</strong>
        </div>
        <button id="sidebar-toggle" class="icon-btn" type="button" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="1.8">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <line x1="9" y1="4" x2="9" y2="20"></line>
          </svg>
        </button>
      </div>

      <div class="sidebar-scroll">
        <div class="nav-group">
          <div class="nav-heading">Instrument</div>
          <button class="nav-btn active" data-view="home" type="button">
            <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
            <span class="nav-label">Home</span>
          </button>
          <button class="nav-btn" data-view="gaze" type="button">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
            <span class="nav-label">Gaze</span>
          </button>
          <button class="nav-btn" data-view="activity" type="button">
            <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            <span class="nav-label">Activity</span>
          </button>
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="nav-btn" data-view="settings" type="button">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="nav-label">Settings</span>
        </button>
        <div class="footer-row">
          <div class="status-chip" title="Engine status">
            <span id="sidebar-dot" class="led"></span>
            <span id="sidebar-state">Stopped</span>
          </div>
          <button id="theme-toggle" class="icon-btn" type="button" title="Toggle light or dark theme" aria-label="Toggle theme">
            <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="1.8">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="site-content">
      <header class="workspace-header">
        <div class="header-left">
          <h2 id="view-title" class="workspace-title">Home</h2>
          <span id="view-sub" class="workspace-sub">Hands-free gaze and voice control</span>
        </div>
        <div class="header-actions">
          <button id="header-listen-btn" class="btn btn-sm" type="button">
            <span id="header-listen-led" class="led"></span>
            <span id="header-listen-label">Listen</span>
          </button>
        </div>
      </header>

      <div class="workspace-body">
        <section id="error-callout" class="error-callout" hidden>
          <div class="error-callout-head">
            <strong id="error-title">Action required</strong>
            <div class="row-gap">
              <button id="error-grant-btn" class="btn btn-sm" type="button" hidden>Grant input access</button>
              <button id="error-copy-btn" class="btn btn-sm" type="button">Copy details</button>
              <button id="error-dismiss-btn" class="btn btn-sm" type="button">Dismiss</button>
            </div>
          </div>
          <div id="error-body"></div>
          <div id="error-cmd-wrap" class="or-copy-field" hidden>
            <code id="error-cmd-text"></code>
            <button id="error-cmd-copy" class="btn btn-sm" type="button">Copy command</button>
          </div>
        </section>

        <div id="view-root"></div>
      </div>
    </main>
  </div>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
